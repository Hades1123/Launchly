name: CI

# Runs every local gate (AGENTS.md "Gates by delivery label") on each push to main and on
# each pull request (opened, new commits pushed, reopened). The live Gemini smoke
# (`pnpm --filter @launchly/api ai:smoke`) is not run here: it needs a real key.
on:
  push:
    branches: [main]
  pull_request:

# A newer run for the same branch or PR replaces the one in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same values the tests and e2e use locally; none is a real secret.
  DATABASE_URL: postgresql://launchly:launchly@localhost:5433/launchly_test
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-jwt-refresh-secret-at-least-32-chars
  AI_DRIVER: mock
  # The API refuses to start without these when MAIL_DRIVER=smtp (the default); nothing is sent.
  SMTP_HOST: localhost
  SMTP_FROM: noreply@launchly.local

jobs:
  gates:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: launchly
          POSTGRES_PASSWORD: launchly
          POSTGRES_DB: launchly_test
        # The tests expect PostgreSQL on host port 5433 (same as `pnpm db:up`).
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U launchly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # coverage:changed diffs against origin/main
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Gate script tests
        run: pnpm test:scripts
      - name: Changed-file coverage (>= 80 % lines and branches)
        # Constitution Principle IV applies this to `feature` tickets only, and the label is a Jira
        # field CI cannot see, so it keys on the branch type (`feat/...`) that
        # CONTRIBUTING.md ties to features. bug and maintenance branches are exempt.
        if: startsWith(github.head_ref || github.ref_name, 'feat/')
        run: pnpm test:coverage && pnpm coverage:changed
      - name: Apply migrations
        run: pnpm db:deploy
      - name: Schema drift (migrations match schema.prisma)
        run: pnpm --filter @launchly/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Database-backed tests
        # One test database, so run the files one after another.
        run: RUN_DB_TESTS=1 pnpm --filter @launchly/api exec vitest run --no-file-parallelism

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://launchly:launchly@localhost:5433/launchly
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: launchly
          POSTGRES_PASSWORD: launchly
          POSTGRES_DB: launchly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U launchly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Migrate and seed
        run: pnpm db:deploy && pnpm db:seed
      - name: Install Chromium
        run: pnpm --filter @launchly/web exec playwright install --with-deps chromium
      - name: e2e
        # Starts its own API (:4100) and web app (:3100).
        run: pnpm --filter @launchly/web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
