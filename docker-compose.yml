services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchly
      POSTGRES_PASSWORD: launchly
      POSTGRES_DB: launchly
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U launchly']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
